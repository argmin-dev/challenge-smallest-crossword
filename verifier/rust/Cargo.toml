[package]
name = "xword-verifier"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Fast verifier for the Smallest Complete Crossword challenge (production)."

[[bin]]
name = "xword-verifier"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
