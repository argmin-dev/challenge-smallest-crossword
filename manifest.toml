# manifest.toml -- Smallest Complete Crossword. Technical contract + content metadata.
# Operational policy (visibility / deadline / rate-limit) is set at deploy time, not here.

slug              = "smallest-complete-crossword"
title             = "Smallest Complete Crossword"
submission_format = "packed-binary-placements (.xwd)"

description_one_line = "Pack every word of the Moby single-word list into the smallest possible square crossword."
verifier_repo_url    = "https://github.com/argmin-dev/challenge-smallest-crossword"

# Ranked metrics, primary first. Strictly lexicographic; exact ties keep the incumbent.
[[metric]]
label     = "side"          # side length of the smallest square enclosing all filled cells
direction = "min"
baseline  = 3388            # the shipped reference solution (reference/baseline.xwd)

[[metric]]
label     = "filled_cells"  # tie-breaker: fewer filled cells == more crossings == tighter weave
direction = "min"
baseline  = 2970647

# Display-only; reported next to each entry, never ranked. Keep this list SHORT: every
# entry is a leaderboard column, and with the two ranked metrics plus rank and solver
# the table starts scrolling sideways at around six. Density is the one that adds
# something the ranked metrics do not already say. Dropped for that reason: `crossings`
# (a fixed offset from filled_cells, so it restates the tie-breaker), and `bbox_width` /
# `bbox_height` (both equal `side` for any solution that fills its bounding square).
# The verifier still computes them; they are simply not declared, so not reported.
[[display_metric]]
label = "density"           # filled_cells / side^2

[dedup]
scope = "challenge"         # dedup across all prior submissions of this challenge.

# Safety-kills only; never affect the score. The Rust verifier checks the full baseline in
# a few seconds; the Python dev path is slower. Ceilings clamp these (<=120s, <=1536MB, <=2 cpu).
[limits]
timeout_seconds = 120
memory_mb       = 1024
cpus            = 1
# Every valid artifact is exactly 5 + 4 * 351049 bytes (see submit.md), so the
# intake cap is that exact size: nothing smaller can be valid, nothing larger is worth
# reading. Submissions are carried as raw bytes, and this counts the file itself.
max_submission_bytes = 1404201

# LOCAL-DEV ONLY: the subprocess driver runs the Python reference without Docker.
# Production ignores this and builds verifier/Dockerfile (the Rust verifier).
[dev]
entrypoint = "python3 verifier/entrypoint.py"

# Full verifier test suite: Python unit tests + Rust unit tests + Python/Rust differential.
[test]
command = "bash tests/run_all.sh"
